name: Build iOS

on:
  push:
    branches: [ "ios-port" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust target
      run: rustup target add aarch64-apple-ios

    - name: Install dependencies
      run: |
        brew install xcodegen cmake ninja boost

    - name: Build touchHLE core for iOS
      run: |
        # Create a CMake wrapper to inject the policy workaround and fix sysroot
        CMAKE_BIN=$(which cmake)
        mkdir -p $HOME/bin
        cat << EOF > $HOME/bin/cmake
        #!/bin/bash
        SDKROOT=\$(xcrun --sdk iphoneos --show-sdk-path)
        args=()
        for arg in "\$@"; do
            if [[ "\$arg" == "-DCMAKE_OSX_SYSROOT=/" ]]; then
                args+=("-DCMAKE_OSX_SYSROOT=\$SDKROOT")
            else
                args+=("\$arg")
            fi
        done
        if [[ "\$1" == "--build" ]]; then
            "$CMAKE_BIN" "\${args[@]}"
        else
            "$CMAKE_BIN" "\${args[@]}" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBoost_INCLUDE_DIR=/opt/homebrew/include
        fi
        EOF
        chmod +x $HOME/bin/cmake
        export PATH="$HOME/bin:$PATH"
        export CMAKE="$HOME/bin/cmake"
        
        cd touchHLE_src
        export CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/ios/ios_toolchain.cmake"
        cargo build --lib --target aarch64-apple-ios --release

    - name: Generate Xcode Project
      run: |
        cd ios
        xcodegen generate
        sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' touchHLE.xcodeproj/project.pbxproj
        sed -i '' 's/LastUpgradeCheck = 1600;/LastUpgradeCheck = 1540;/g' touchHLE.xcodeproj/project.pbxproj

    - name: Build Xcode Project (Unsigned)
      run: |
        cd ios
        # We build for generic iOS device (arm64) without code signing so the user can sign it themselves (e.g. via AltStore/TrollStore)
        xcodebuild -project touchHLE.xcodeproj \
                   -scheme touchHLE \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build \
                   CONFIGURATION_BUILD_DIR="$(pwd)/build"

    - name: Package IPA
      run: |
        cd ios/build
        mkdir Payload
        mv touchHLE.app Payload/
        
        # Debug the contents of the app bundle to see why it's so small
        echo "Contents of touchHLE.app:"
        ls -la Payload/touchHLE.app/
        
        # Copy necessary resources into the bundle
        cp -R $GITHUB_WORKSPACE/touchHLE_dylibs Payload/touchHLE.app/
        cp -R $GITHUB_WORKSPACE/touchHLE_fonts Payload/touchHLE.app/
        cp $GITHUB_WORKSPACE/touchHLE_src/touchHLE_default_options.txt Payload/touchHLE.app/
        
        # Rename all dylibs to .bin to avoid iOS Code Signing architecture validation failures
        find Payload/touchHLE.app/touchHLE_dylibs -type f -name "*.dylib" -exec mv {} {}.bin \;
        
        # Create the touchHLE_apps folder inside the app bundle so touchHLE automatically finds it
        mkdir -p Payload/touchHLE.app/touchHLE_apps
        
        # If the user uploaded the game IPA to the root of the repository, bundle it!
        if ls $GITHUB_WORKSPACE/*.ipa 1> /dev/null 2>&1; then
          echo "Found a game IPA! Bundling it inside touchHLE_apps..."
          cp $GITHUB_WORKSPACE/*.ipa Payload/touchHLE.app/touchHLE_apps/
        else
          echo "No game IPA found in the repository root. You will need to sideload it manually or upload it to the repo."
        fi
        
        zip -r touchHLE_iOS.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: touchHLE-iOS
        path: ios/build/touchHLE_iOS.ipa
